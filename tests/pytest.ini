[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Reporting
addopts = 
    -v
    --tb=short
    --color=yes
    --no-header
    --no-summary

# Custom markers
markers =
    requires_pandoc: mark test as requiring pandoc
    requires_display: mark test as requiring a display server
    platform_windows: mark test as Windows-only
    platform_macos: mark test as macOS-only
    platform_linux: mark test as Linux-only

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
