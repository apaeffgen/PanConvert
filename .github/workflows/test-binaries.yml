name: Test Packaged Binaries

on:
  push:
    branches: [main, master]
    paths:
      - 'source/**'
      - 'tests/**'
      - 'packaging/**'
      - '.github/workflows/*.yml'
  pull_request:
    branches: [main, master]
  schedule:
    # Run weekly on Monday at 6am UTC
    - cron: '0 6 * * 1'

jobs:
  # ── Build binaries for each platform ──

  build-windows:
    name: Build Windows binary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install PyQt6 PyQt6-WebEngine
          pip install -r requirements.txt

      - name: Build standalone executable
        run: |
          python packaging/windows/build_exe.py --clean
        shell: bash

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: panconvert-windows
          path: dist/Panconvert*.exe
          retention-days: 7

  build-macos:
    name: Build macOS binary
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install PyQt6 PyQt6-WebEngine
          pip install -r requirements.txt
          brew install pandoc

      - name: Build .app bundle
        run: |
          python -m PyInstaller --clean --noconfirm packaging/Panconvert_pyinstaller.spec
        shell: bash

      - name: Build PKG installer
        run: |
          pip install macOS-Pkg-Builder
          bash packaging/macos/build_pkg.sh
        shell: bash

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: panconvert-macos
          path: |
            dist/Panconvert*.app
            dist/Panconvert*-macos.pkg
          retention-days: 7

  build-linux:
    name: Build Linux binary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-venv gcc make qt6-base-dev
          sudo apt-get install -y libxcb-cursor0 libxcb-icccm4 libxcb-keysyms0 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libxcb-xkb1 libxcb-util1 libxcb-image0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install PyQt6 PyQt6-WebEngine
          pip install -r requirements.txt
          pip install pandoc  # For format testing

      - name: Build Linux binary
        run: |
          bash packaging/linux/build_linux.sh
        shell: bash

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: panconvert-linux
          path: dist/Panconvert-*-linux*
          retention-days: 7

  # ── Test each platform ──

  test-windows:
    name: Test Windows binary
    needs: build-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: panconvert-windows
          path: dist/

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest PyQt6 PyQt6-WebEngine
          pip install -r requirements.txt

      - name: Run binary tests
        run: |
          cd tests
          bash run_tests.sh -p -- -v

      - name: Run conversion tests
        run: |
          cd tests
          bash run_tests.sh -c -- -v

  test-macos:
    name: Test macOS binary
    needs: build-macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: panconvert-macos
          path: dist/

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-qt PyQt6 PyQt6-WebEngine
          pip install -r requirements.txt
          brew install pandoc

      - name: Run binary tests
        run: |
          cd tests
          bash run_tests.sh -p -- -v

      - name: Run conversion tests
        run: |
          cd tests
          bash run_tests.sh -c -- -v

      - name: Run GUI tests
        run: |
          cd tests
          bash run_tests.sh -g -- -v

  test-linux:
    name: Test Linux binary
    needs: build-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: panconvert-linux
          path: dist/

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-qt PyQt6 PyQt6-WebEngine
          pip install -r requirements.txt

      - name: Run binary tests
        run: |
          cd tests
          bash run_tests.sh -p -- -v

      - name: Run conversion tests
        run: |
          cd tests
          bash run_tests.sh -c -- -v

  # ── Run all tests locally (for PRs) ──

  test-all:
    name: Run all tests (local)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-qt PyQt6 PyQt6-WebEngine
          pip install -r requirements.txt

      - name: Install pandoc
        if: matrix.os != 'windows-latest'
        run: |
          if [[ "${{ matrix.os }}" == *"macos"* ]]; then
            brew install pandoc
          elif [[ "${{ matrix.os }}" == *"ubuntu"* ]]; then
            sudo apt-get update && sudo apt-get install -y pandoc
          fi

      - name: Install pandoc (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install pandoc
        shell: bash

      - name: Run all tests
        run: |
          cd tests
          bash run_tests.sh -- -v
